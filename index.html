<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,

	position: absolute;

	top: 0;
	}

	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,

.leaflet-safari .leaflet-tile-container {

}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;

	}

	touch-action: none;

.leaflet-popup {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";

.leaflet-oldie .leaflet-control-zoom,

<style>/* ================= Geländetaufe – mobil ================= */
:root{
  --acc:#1e3a5f; --acc2:#2f5d8a; --red:#c81e1e; --green:#3f9d3f; --yel:#facc15;
  --ink:#1f2937; --mut:#5b6573; --line:#d5dbe3; --card:#fff; --fld:#fffbe6; --fldb:#c9ab3c;
  --tb:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#d9dde2;color:var(--ink);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0;touch-action:none}
@supports (overflow:clip){html,body{overflow:clip}}
#map{position:absolute;inset:0;background:#d9dde2}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}
input,select{font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
input[type=text],input[type=search],input[type=number]{width:100%;height:44px;border:1.5px solid var(--fldb);background:var(--fld);border-radius:8px;padding:0 10px;color:var(--ink)}
input:focus{outline:none;border-color:#2563eb;background:#fff}

/* ---------- Kopf: Menü + Suche ---------- */
#top{position:absolute;left:0;right:0;top:0;z-index:1000;display:flex;gap:6px;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 8px) 0 calc(var(--sal) + 8px);pointer-events:none}
#top>*{pointer-events:auto}
.fab{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:21px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:0}
.fab.w{background:#fff;color:var(--acc)}
.fab:active{filter:brightness(1.15)}
#qwrap{flex:1;min-width:0;position:relative}
#q{width:100%;height:46px;border:0;border-radius:12px;background:#fff;padding:0 40px 0 14px;box-shadow:0 2px 8px rgba(0,0,0,.35);color:var(--ink)}
#q::placeholder{color:#8a94a3}
#qx{position:absolute;right:4px;top:5px;width:36px;height:36px;border:0;background:none;color:#8a94a3;font-size:20px;display:none}
#res{position:absolute;z-index:1001;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);top:calc(var(--sat) + 60px);
  max-height:55%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.35);display:none}
#res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 14px;line-height:1.3}
#res button:last-child{border-bottom:0}
#res button b{display:block;font-size:15px}
#res button span{font-size:12.5px;color:var(--mut)}
#res .msg{padding:14px;color:var(--mut)}

/* ---------- rechte Knöpfe ---------- */
#side{position:absolute;z-index:1000;right:calc(var(--sar) + 8px);top:calc(var(--sat) + 64px);display:flex;flex-direction:column;gap:8px}
#side .fab{font-size:24px;font-weight:600}
#side #bLayer,#side #bList,#side #bLock,#side #bLoc{font-size:10.5px;font-weight:700;line-height:1.1;flex-direction:column;gap:2px}
#side #bLayer svg,#side #bList svg,#side #bLoc svg{width:20px;height:20px}

/* ---------- Werkzeugleiste unten ---------- */

function rotV(x,y,deg){ const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a); return {x:x*c-y*s, y:x*s+y*c}; }
function mpp(lat){ return 40075016.686*Math.cos(lat*Math.PI/180)/Math.pow(2,map.getZoom()+8); }

/* ---------- Speicher (Geländetaufen) ---------- */
const LS='gelaendetaufe.v1';
let DB={cur:null,list:[]};
let P=null;                 // aktive Geländetaufe
let UNDO=[];
function newProject(){
  const ok=map&&map._loaded; const c=ok? map.getCenter() : {lat:47.6,lng:13.8};
  return {id:uid(), name:'Geländetaufe '+stamp(), addr:'', created:Date.now(), updated:Date.now(),
    view:{lat:c.lat,lng:c.lng,z:ok?map.getZoom():7}, layer:'ortho',
    frames:[], shapes:[], marks:[], next:{L:0,A:1,R:1}, seqv:2,
    grid:{on:false,cell:10,cols:16,rows:16,lat:null,lng:null,color:'#111111',op:.75}};
}
function load(){
  try{ const s=localStorage.getItem(LS); if(s) DB=JSON.parse(s); }catch(e){}
  if(!DB||!Array.isArray(DB.list)) DB={cur:null,list:[]};
  P=DB.list.find(p=>p.id===DB.cur)||DB.list[0]||null;
  if(!P){ P=newProject(); DB.list.push(P); }
  DB.cur=P.id;
  DB.list.forEach(fixProject);
}
function fixProject(p){ const G=p.grid||(p.grid={on:false,cell:10,cols:16,rows:16,lat:null,lng:null}); if(!G.color) G.color='#111111'; if(G.op==null) G.op=.75; (p.frames||[]).forEach(f=>{ if(f.op==null) f.op=1; }); if(!p.shapes) p.shapes=[];
  p.shapes.forEach(x=>{ if(x.fo==null) x.fo=.22*(x.op??1); if(x.sw==null) x.sw=x.k==='arrow'?6:4; if(x.label==null){ x.label=x.note||''; } });
  if(!p.seqv){ const n=p.next||(p.next={L:0,A:1,R:1}); if(n.L>0){ const last=SEQ_OLD[Math.min(n.L,SEQ_OLD.length)-1]; n.L=SEQ_L.indexOf(last)+1; } p.seqv=2; } }
let saveT=null;
function save(){ P.updated=Date.now(); clearTimeout(saveT); saveT=setTimeout(saveNow,150); }
function saveNow(){ clearTimeout(saveT); try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){ toast('Speichern nicht möglich (Speicher voll oder privat-Modus).'); } }
function pushUndo(){ UNDO.push(JSON.stringify(P)); if(UNDO.length>40) UNDO.shift(); updTools(); }
function toggleLock(){
  DB.locked=!DB.locked; saveNow();
  if(DB.locked){ setTool(null); stopGridMove(); if(selFrame||selShape) deselectFrame(); closeSheets(); }
  Object.values(markerObjs).forEach(mk=>{ if(mk.dragging){ DB.locked? mk.dragging.disable() : mk.dragging.enable(); } });
  updTools(); toast(DB.locked?'🔒 Gesperrt: Marker, Rahmen und Raster können nicht verändert werden':'🔓 Entsperrt: Bearbeiten wieder möglich');
}
function undo(){
  if(!UNDO.length||isLocked()) return;
  const o=JSON.parse(UNDO.pop()); Object.keys(P).forEach(k=>delete P[k]); Object.assign(P,o);
  selFrame=null; selShape=null; stopGridMove(); closeSheets(); save(); drawAll(); updTools(); toast('Rückgängig gemacht');
}

/* ---------- Kartenkacheln mit Zwischenspeicher (IndexedDB) ---------- */
const TDB={p:null};
function tdb(){ if(TDB.p) return TDB.p; TDB.p=new Promise(res=>{ try{ const r=indexedDB.open('gelaendetaufe-kacheln',1);
  r.onupgradeneeded=()=>{ const s=r.result.createObjectStore('t'); s.createIndex('ts','ts'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); return TDB.p; }
function tget(k){ return tdb().then(db=>!db?null:new Promise(res=>{ try{ const q=db.transaction('t').objectStore('t').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }catch(e){ res(null); } })); }
function tput(k,b){ tdb().then(db=>{ if(!db) return; try{ db.transaction('t','readwrite').objectStore('t').put({b,ts:Date.now()},k); }catch(e){} }); }
async function tprune(max=8000){ const db=await tdb(); if(!db) return; try{ const st=db.transaction('t','readwrite').objectStore('t'); const c=st.count();
  c.onsuccess=()=>{ let del=c.result-max; if(del<=0) return; del+=800; st.index('ts').openCursor().onsuccess=e=>{ const cur=e.target.result; if(cur&&del-->0){ cur.delete(); cur.continue(); } }; }; }catch(e){} }
async function tcount(){ const db=await tdb(); if(!db) return 0; return new Promise(res=>{ try{ const c=db.transaction('t').objectStore('t').count(); c.onsuccess=()=>res(c.result); c.onerror=()=>res(0);}catch(e){res(0)} }); }
async function tclear(){ const db=await tdb(); if(!db) return; return new Promise(res=>{ try{ const tx=db.transaction('t','readwrite'); tx.objectStore('t').clear(); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }catch(e){res()} }); }

const CacheLayer=L.TileLayer.extend({
  createTile(coords,done){
    const img=document.createElement('img'); img.alt=''; img.setAttribute('role','presentation');
    const url=this.getTileUrl(coords);
    let finished=false; const fin=(err)=>{ if(finished) return; finished=true; done(err,img); };
    const direct=()=>{ // ohne Zwischenspeicher, zuerst mit CORS (für Bildexport), sonst normal
      img.onload=()=>{ img.dataset.safe='1'; fin(null); };
      img.onerror=()=>{ img.onload=()=>fin(null); img.onerror=e=>fin(e||new Error('Kachel')); img.removeAttribute('crossorigin'); img.src=url+(url.includes('?')?'&':'?')+'nc=1'; };
      img.crossOrigin='anonymous'; img.src=url;
    };
    const fromBlob=b=>{ img._ou=URL.createObjectURL(b); img.onload=()=>{ img.dataset.safe='1'; fin(null); };
      img.onerror=()=>{ try{URL.revokeObjectURL(img._ou);}catch(e){} img._ou=null; direct(); }; img.src=img._ou; };
    tget(url).then(r=>{
      if(r&&r.b){ fromBlob(r.b); return; }
      if(navigator.onLine===false){ direct(); return; }
      fetch(url,{mode:'cors',credentials:'omit'}).then(x=>{ if(!x.ok) throw new Error('HTTP '+x.status); return x.blob(); })
        .then(b=>{ if(!b.size) throw new Error('leer'); tput(url,b); fromBlob(b); }).catch(direct);
    });
    return img;
  }
});

let selFrame=null;          // id des ausgewählten Rahmens
let selShape=null;          // id der ausgewählten Zeichnung
let curMark=null;           // id des Markers im Marker-Fenster
const markerObjs={};

function initMap(){
  map=L.map('map',{zoomControl:false,maxZoom:21,zoomSnap:.5,zoomDelta:1,bounceAtZoomLimits:false,attributionControl:true,tapTolerance:20});
  map.attributionControl.setPrefix(false);
  map.createPane('labels').style.zIndex=250;
  map.createPane('grid').style.zIndex=410;
  map.createPane('shapes').style.zIndex=415;
  map.createPane('frames').style.zIndex=420;
  map.createPane('handles').style.zIndex=660;
  gridL=L.layerGroup().addTo(map);
  shapeL=L.layerGroup().addTo(map);
  draftL=L.layerGroup().addTo(map);
  map.on('zoomend',()=>{ if((P.shapes||[]).some(x=>x.label&&x.label.trim())) drawShapes(); });
  frameL=L.layerGroup().addTo(map);
  markL=L.layerGroup().addTo(map);
  hdlL=L.layerGroup().addTo(map);
  posL=L.layerGroup().addTo(map);

  map.on('moveend',()=>{ const c=map.getCenter(); P.view={lat:c.lat,lng:c.lng,z:map.getZoom()}; save(); });
  map.on('zoomend',()=>{ drawGrid(); if(selFrame) drawHandles(); if(selShape) drawShapeHandles(); });
}
function setBase(){
  if(baseL) map.removeLayer(baseL); if(ovL){ map.removeLayer(ovL); ovL=null; }
  const Ld=LAYERS[P.layer]||LAYERS.ortho;
  const opt={maxNativeZoom:19,maxZoom:21,keepBuffer:3};
  baseL=new CacheLayer(Ld.url,Object.assign({attribution:'Karte: <a href="https://basemap.at" target="_blank" rel="noopener">basemap.at</a>'},opt)).addTo(map);
  baseL.on('tileunload',unloadTile);
  if(Ld.ov){ ovL=new CacheLayer(OVERLAY,Object.assign({pane:'labels'},opt)).addTo(map); ovL.on('tileunload',unloadTile); }
  const b=$('bLayer'); if(b) b.querySelector('.lb').textContent={ortho:'Ortho',karte:'Karte',grau:'Grau'}[P.layer]||Ld.n;
}
function unloadTile(e){ if(e.tile&&e.tile._ou){ try{URL.revokeObjectURL(e.tile._ou);}catch(x){} e.tile._ou=null; } }
function drawAll(){ setBase(); drawGrid(); drawShapes(); drawFrames(); drawMarks(); hdlL.clearLayers(); if(selFrame) drawHandles(); if(selShape) drawShapeHandles(); updTools(); }

function onMapClick(e){
  if(e.originalEvent&&e.originalEvent._gt) return;
  closeResults();
  if(isMarkTool(tool)){ placeMark(tool,e.latlng); return; }
  if(DRAW_TOOLS.includes(tool)){ drawClick(e.latlng); return; }
  if($('hint').classList.contains('panel')&&$('hint').dataset.picker){ setHint(null); }
  if(selFrame||selShape){ deselectFrame(); return; }
}

/* ---------- Marker: L (rot), 1 2 3 (gelb), I II III (gelb) ---------- */
function nextVal(t){
  const n=P.next;
  if(t==='L') return n.L<SEQ_L.length? SEQ_L[n.L] : null;
  if(t==='A') return String(n.A);
  if(t==='R') return roman(n.R);
}
function placeMark(t,ll){
  if(t.startsWith('S:')){ const id=t.slice(2); pushUndo(); const m={id:uid(),t:'S',v:id,lat:ll.lat,lng:ll.lng,note:''}; P.marks.push(m); save(); drawMark(m); updTools();
    setHint(SYM[id].n+' gesetzt · weiter tippen',[{t:'Fertig',fn:()=>setTool(null)}]); return; }
  const v=nextVal(t);
  if(v==null){ toast('Alle Buchstaben J bis Z sind vergeben.'); setTool(null); return; }
  pushUndo();
  const m={id:uid(),t,v,lat:ll.lat,lng:ll.lng,note:''};
  P.marks.push(m); P.next[t]++;          // vergeben = verbraucht, auch nach dem Löschen
  save(); drawMark(m); updTools();
  const nv=nextVal(t);
  setHint(nv==null? 'Letzter Buchstabe gesetzt.' : TYPES[t].n+' '+v+' gesetzt · nächster: '+nv,[{t:'Fertig',fn:()=>setTool(null)}]);
  if(t==='L'&&nv==null) setTool(null);
}
function markHTML(t,v,extra){ if(t==='S') return `<div class="mkw"><div class="mks${extra?' '+extra:''}">${symSVG(v)}</div></div>`; return `<div class="mkw"><div class="mk ${TYPES[t].cls}${extra?' '+extra:''}">${esc(v)}</div></div>`; }
/* Antippen: kleines Fenster mit Notiz (nur hier sichtbar) */
function showMarkPopup(id){
  const m=P.marks.find(x=>x.id===id); if(!m) return;
  if(tool) setTool(null); if(selFrame||selShape) deselectFrame();
  const feld=feldAt(m.lat,m.lng);
  const div=h('div',{class:'mpop'},
    h('div',{class:'mtop'}, h('b',null,mname(m)), feld? h('span',{class:'muted'},'Feld '+feld):null),
    m.note? h('div',{class:'note'},m.note) : null,
    isLocked()? h('div',{class:'muted'},'🔒') : h('div',{class:'micons'},
      h('button',{class:'ib','aria-label':'Bearbeiten',onclick:()=>{ map.closePopup(); openMark(m.id); }},'✎'),
      h('button',{class:'ib del','aria-label':'Löschen',onclick:()=>{ map.closePopup(); pushUndo(); P.marks=P.marks.filter(x=>x.id!==m.id); save(); drawMarks(); toast(mname(m)+' gelöscht (Zurück macht es rückgängig)'); }},'🗑')));
  L.popup({offset:[0,-14],closeButton:false,autoPanPadding:[20,90],maxWidth:220,minWidth:0,className:'mpopw'}).setLatLng([m.lat,m.lng]).setContent(div).openOn(map);
}
function drawMarks(){ markL.clearLayers(); for(const k in markerObjs) delete markerObjs[k]; P.marks.forEach(drawMark); }
function drawMark(m){
  const lbl=(m.show&&m.note&&m.note.trim())? `<div class="mnote">${esc(m.note.trim())}</div>` : '';
  const icon=m.t==='S'? L.divIcon({className:'mwrap',html:markHTML(m.t,m.v)+lbl,iconSize:[38,38],iconAnchor:[19,19]}) : L.divIcon({className:'mwrap',html:markHTML(m.t,m.v)+lbl,iconSize:[64,38],iconAnchor:[32,19]});
  const mk=L.marker([m.lat,m.lng],{icon,draggable:!isLocked(),autoPan:true,keyboard:false,zIndexOffset:m.t==='L'?0:m.t==='S'?50:100}).addTo(markL);
  mk.on('dragstart',()=>pushUndo());
  mk.on('dragend',()=>{ const p=mk.getLatLng(); m.lat=p.lat; m.lng=p.lng; save(); if(curMark===m.id) openMark(m.id); });
  mk.on('click',()=>showMarkPopup(m.id));
  markerObjs[m.id]=mk;
}

/* ---------- Rahmen mit Farbcode (Weiß unten, Grün links, Schwarz oben, Rot rechts) ---------- */
function frameCornersM(f){ return [[-1,-1],[-1,1],[1,1],[1,-1]].map(([sx,sy])=>rotV(sx*f.w/2,sy*f.h/2,f.a)); } // 0 UL,1 OL,2 OR,3 UR
function frameCorners(f){ return frameCornersM(f).map(p=>fromM(f.lat,f.lng,p.x,p.y)); }
const SIDES=[[3,0,WHITE],[0,1,GREEN],[1,2,BLACK],[2,3,RED]];   // unten, links, oben, rechts
const frameLayers={};
function drawFrames(){ frameL.clearLayers(); for(const k in frameLayers) delete frameLayers[k]; P.frames.forEach(drawFrame); }
function drawFrame(f){
  if(frameLayers[f.id]) frameL.removeLayer(frameLayers[f.id]);
  const g=L.layerGroup(); const c=frameCorners(f); const sel=selFrame===f.id;
  const op=f.op??1;
  const area=L.polygon(c,{pane:'frames',stroke:false,fillColor:'#2563eb',fillOpacity:sel?.12:.001,bubblingMouseEvents:true}).addTo(g);
  area.on('click',e=>{ if(tool||isLocked()) return; e.originalEvent._gt=1; selectFrame(f.id); });
  SIDES.forEach(([a,b,col])=>{
    L.polyline([c[a],c[b]],{pane:'frames',color:'#111',weight:11,opacity:.9*op,lineCap:'square',interactive:false}).addTo(g);
    L.polyline([c[a],c[b]],{pane:'frames',color:col,weight:7,opacity:op,lineCap:'square',interactive:false}).addTo(g);
  });
  g.addTo(frameL); frameLayers[f.id]=g;
}
function selectFrame(id){ setTool(null); stopGridMove(); closeSheets(); if(selShape){ selShape=null; drawShapes(); } selFrame=id; drawFrames(); drawHandles(); showFramePanel(); }
function deselectFrame(){ selFrame=null; selShape=null; hdlL.clearLayers(); drawFrames(); drawShapes(); setHint(null); }
let hdls=[];
function drawHandles(obj,redraw,onEnd){
  hdlL.clearLayers(); hdls=[];
  const f=obj||P.frames.find(x=>x.id===selFrame); if(!f){ selFrame=null; return; }
  redraw=redraw||drawFrame; onEnd=onEnd||showFramePanel;
  const mk=(cls,txt,size)=>L.marker([f.lat,f.lng],{pane:'handles',draggable:true,keyboard:false,autoPan:false,
    icon:L.divIcon({className:'',html:`<div class="hdl ${cls}"><i>${txt||''}</i></div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]})}).addTo(hdlL);
  const corners=[0,1,2,3].map(i=>{ const m=mk('cn','',44); m._ci=i; return m; });
  const rot=mk('rot','⟳',48), mv=mk('mv','✥',48);
  hdls={corners,rot,mv};
  placeHandles(f);
  let st=null;
  corners.forEach(m=>{
    m.on('dragstart',()=>{ pushUndo(); const cm=frameCornersM(f); const o=cm[(m._ci+2)%4]; st={lat0:f.lat,lng0:f.lng,Q:o}; });
    m.on('drag',()=>{ const ll=m.getLatLng(); const Pm=toM(st.lat0,st.lng0,ll.lat,ll.lng); const Q=st.Q;
      const d=rotV(Pm.x-Q.x,Pm.y-Q.y,-f.a); f.w=Math.max(2,Math.abs(d.x)); f.h=Math.max(2,Math.abs(d.y));
      const mid=fromM(st.lat0,st.lng0,(Pm.x+Q.x)/2,(Pm.y+Q.y)/2); f.lat=mid[0]; f.lng=mid[1];
      redraw(f); placeHandles(f,m); });
    m.on('dragend',()=>{ save(); placeHandles(f); onEnd(); });
  });
  rot.on('dragstart',()=>pushUndo());
  rot.on('drag',()=>{ const ll=rot.getLatLng(); const v=toM(f.lat,f.lng,ll.lat,ll.lng); let a=Math.atan2(v.y,v.x)*180/Math.PI-90;
    a=((a%360)+360)%360; for(const s of [0,90,180,270,360]) if(Math.abs(a-s)<4) a=s%360; f.a=a; redraw(f); placeHandles(f,rot); });
  rot.on('dragend',()=>{ save(); placeHandles(f); onEnd(); });
  mv.on('dragstart',()=>pushUndo());
  mv.on('drag',()=>{ const ll=mv.getLatLng(); f.lat=ll.lat; f.lng=ll.lng; redraw(f); placeHandles(f,mv); });
  mv.on('dragend',()=>{ save(); placeHandles(f); });
}
function placeHandles(f,skip){
  if(!hdls.corners) return;
  const c=frameCorners(f);
  hdls.corners.forEach((m,i)=>{ if(m!==skip) m.setLatLng(c[i]); });
  const off=f.h/2+46*mpp(f.lat); const r=rotV(0,off,f.a);
  if(hdls.rot!==skip) hdls.rot.setLatLng(fromM(f.lat,f.lng,r.x,r.y));
  if(hdls.mv!==skip) hdls.mv.setLatLng([f.lat,f.lng]);
}
function showFramePanel(){
  const f=P.frames.find(x=>x.id===selFrame); if(!f) return;
  const el=$('hint'); el.innerHTML=''; el.classList.add('panel'); delete el.dataset.picker;
  const size=h('b',null,`Rahmen ${Math.round(f.w)} × ${Math.round(f.h)} m`);
  const rng=h('input',{type:'range',min:15,max:100,step:5,value:Math.round((f.op??1)*100)});
  const pct=h('span',{class:'pct'},Math.round((f.op??1)*100)+' %');
  rng.addEventListener('pointerdown',()=>pushUndo());
  rng.oninput=()=>{ f.op=+rng.value/100; pct.textContent=rng.value+' %'; drawFrame(f); save(); };
  el.append(
    h('div',{class:'prow'}, size, h('div',{style:'flex:1'}),
      h('button',{class:'red',onclick:e=>{ e.stopPropagation(); pushUndo(); P.frames=P.frames.filter(x=>x.id!==f.id); save(); deselectFrame(); }},'Löschen'),
      h('button',{onclick:e=>{ e.stopPropagation(); deselectFrame(); }},'Fertig')),
    h('div',{class:'prow'}, h('span',null,'Intensität'), rng, pct));
  el.style.display='flex';
}

const SHAPE_TOOLS=['rect','circle','poly','arrow'];
const DRAW_TOOLS=['frame',...SHAPE_TOOLS];
const SHAPE_N={frame:'Rahmen',poly:'Fläche',rect:'Rechteck',circle:'Kreis',arrow:'Pfeil'};
const SHAPE_COLORS=[['#c81e1e','Rot'],['#f97316','Orange'],['#facc15','Gelb'],['#16a34a','Grün'],['#1d4ed8','Blau'],['#111111','Schwarz'],['#ffffff','Weiß']];
const DEF_COL='#c81e1e';
const SHAPE_ICON={
  frame:'<span class="mk mkG"></span>',
  poly:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8l7-5 9 6-3 11H6z" fill="currentColor" fill-opacity=".3"/></svg>',
  rect:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="12" fill="currentColor" fill-opacity=".3"/></svg>',
  circle:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5" fill="currentColor" fill-opacity=".3"/><path d="M12 12h8.5" stroke-dasharray="2 2"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L18 6"/><path d="M10 5h9v9"/></svg>',
  grid:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>'
};
let draft=[];                 // bereits angetippte Punkte des aktuellen Zeichenwerkzeugs
const shapeLayers={};
function visW(ll){ const b=map.getBounds(); return toM(ll.lat,ll.lng,ll.lat,b.getEast()).x - toM(ll.lat,ll.lng,ll.lat,b.getWest()).x; }
function arrowGeom(s){
  const [A,B]=s.pts; const v=toM(A[0],A[1],B[0],B[1]); const len=Math.hypot(v.x,v.y)||1; const ux=v.x/len, uy=v.y/len;
  const sw=s.sw??5; const hl=Math.max(1.5,Math.min(len*.3,30))*Math.max(1,sw/5), hw=hl*.6;
  const bx=v.x-ux*hl, by=v.y-uy*hl;
  return {len, line:[A,fromM(A[0],A[1],bx+ux*hl*.15,by+uy*hl*.15)], head:[B,fromM(A[0],A[1],bx-uy*hw,by+ux*hw),fromM(A[0],A[1],bx+uy*hw,by-ux*hw)]};
}
function polyArea(pts){ if(pts.length<3) return 0; const o=pts[0]; const q=pts.map(p=>toM(o[0],o[1],p[0],p[1])); let a=0; for(let i=0;i<q.length;i++){ const j=(i+1)%q.length; a+=q[i].x*q[j].y-q[j].x*q[i].y; } return Math.abs(a/2); }
function fmtM(m){ return m>=1000? (m/1000).toFixed(2).replace('.',',')+' km' : Math.round(m)+' m'; }
function fmtA(a){ return a>=10000? (a/10000).toFixed(2).replace('.',',')+' ha' : Math.round(a).toLocaleString('de-AT')+' m²'; }
function shapeInfo(s){
  if(s.k==='rect') return `${Math.round(s.w)} × ${Math.round(s.h)} m · ${fmtA(s.w*s.h)}`;
  if(s.k==='circle') return `r ${fmtM(s.r)} · ${fmtA(Math.PI*s.r*s.r)}`;
  if(s.k==='arrow') return fmtM(arrowGeom(s).len);
  return fmtA(polyArea(s.pts));
}
/* Rechteck aus 3 Punkten: 1 und 2 = eine Seite (beim Rahmen die weiße Seite), 3 = Breite */
function rect3(A,B,C){
  const b=toM(A[0],A[1],B[0],B[1]), c=toM(A[0],A[1],C[0],C[1]);
  const len=Math.hypot(b.x,b.y)||1, ux=b.x/len, uy=b.y/len, nx=-uy, ny=ux;
  const d=c.x*nx+c.y*ny; let a=Math.atan2(uy,ux)*180/Math.PI; if(d<0) a+=180;
  const cx=b.x/2+nx*d/2, cy=b.y/2+ny*d/2; const ctr=fromM(A[0],A[1],cx,cy);
  return {lat:ctr[0],lng:ctr[1],w:Math.max(1,len),h:Math.max(1,Math.abs(d)),a:((a%360)+360)%360};
}
/* Kanten einer Zeichnung (für die Beschriftung entlang der Außenlinie) */
function shapeEdges(s){
  if(s.k==='arrow') return [[s.pts[0],s.pts[1]]];
  if(s.k==='circle') return [];
  const p=s.k==='rect'? frameCorners(s) : s.pts;
  return p.map((q,i)=>[q,p[(i+1)%p.length]]);
}
function edgeLen(e){ const v=toM(e[0][0],e[0][1],e[1][0],e[1][1]); return Math.hypot(v.x,v.y); }
function longestEdge(s){ const E=shapeEdges(s); let bi=0,bl=-1; E.forEach((e,i)=>{ const l=edgeLen(e); if(l>bl){bl=l;bi=i;} }); return bi; }
function shapeCenter(s){ if(s.k==='rect'||s.k==='circle') return [s.lat,s.lng]; const n=s.pts.length; return s.pts.reduce((a,p)=>[a[0]+p[0]/n,a[1]+p[1]/n],[0,0]); }
/* Beschriftung: Schriftgröße wächst mit der Linienstärke.
   „Entlang der Außenlinie“: Text sitzt in einer Lücke der Linie – beim Rechteck/der Fläche auf jeder Seite, beim Kreis einmal oben. */
function lblFont(s){ const sw=s.sw??(s.k==='arrow'?5:3); return Math.round(11+sw*1.5); }
let _mc=null; function textW(t,fs){ _mc=_mc||document.createElement('canvas').getContext('2d'); _mc.font='bold '+fs+'px Arial'; return _mc.measureText(t).width; }
function readable(a){ if(a>90) a-=180; if(a<=-90) a+=180; return a; }
function lerp(p,q,t){ return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]; }
function labelLayout(s){
  const txt=(s.label||'').trim(), fs=lblFont(s), sw=s.sw??(s.k==='arrow'?5:3);
  const out={fs,labels:[],segs:null};
  if(!txt) return out;
  const pos=s.k==='arrow'?'arrow':(s.lpos||'center');
  const tw=textW(txt,fs), gap=tw+fs*.7;
  const P2=ll=>map.latLngToContainerPoint(ll);
  if(pos==='center'){ out.labels.push({ll:shapeCenter(s),ang:0,ox:0,oy:0}); return out; }
  if(pos==='arrow'){ const [A,B]=s.pts; const p1=P2(A), p2=P2(B); const ang=readable(Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI);
    let nx=-(p2.y-p1.y), ny=p2.x-p1.x; const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl; if(ny>0){ nx=-nx; ny=-ny; }
    const off=sw/2+fs*.75; out.labels.push({ll:lerp(A,B,.45),ang,ox:nx*off,oy:ny*off}); return out; }
  if(s.k==='circle'){
    const rpx=s.r/mpp(s.lat); const circ=2*Math.PI*rpx;
    const f=Math.min(fs,fs*circ*.2/gap);                 // Schrift so verkleinern, dass sie in die Lücke passt
    if(f<9){ out.labels.push({ll:[s.lat,s.lng],ang:0,ox:0,oy:0}); return out; }
    const g2=gap*f/fs, half=g2/2/rpx, N=96, pts=[];   // Lücke oben (Norden)
    for(let i=0;i<=N;i++){ const t=Math.PI/2+half+(2*Math.PI-2*half)*i/N; pts.push(fromM(s.lat,s.lng,Math.cos(t)*s.r,Math.sin(t)*s.r)); }
    out.segs=[pts]; out.labels.push({ll:fromM(s.lat,s.lng,0,s.r),ang:0,ox:0,oy:0,fs:Math.round(f)}); return out;
  }
  const corners=s.k==='rect'? frameCorners(s) : s.pts; out.segs=[];
  corners.forEach((p,i)=>{ const q=corners[(i+1)%corners.length]; const a=P2(p), b=P2(q); const L=Math.hypot(b.x-a.x,b.y-a.y);
    const f=Math.min(fs,fs*L*.7/gap);                    // je Seite passend verkleinern
    if(f<9){ out.segs.push([p,q]); return; }
    const g2=gap*f/fs, t0=.5-g2/2/L, t1=.5+g2/2/L;
    out.segs.push([p,lerp(p,q,t0)],[lerp(p,q,t1),q]);
    out.labels.push({ll:lerp(p,q,.5),ang:readable(Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI),ox:0,oy:0,fs:Math.round(f)}); });
  if(!out.labels.length){ out.segs=null; out.labels.push({ll:shapeCenter(s),ang:0,ox:0,oy:0}); }
  return out;
}
function drawShapes(){ shapeL.clearLayers(); for(const k in shapeLayers) delete shapeLayers[k]; (P.shapes||[]).forEach(drawShape); }
function drawShape(s){
  if(shapeLayers[s.id]) shapeL.removeLayer(shapeLayers[s.id]);
  const g=L.layerGroup(), col=s.color||DEF_COL, sel=selShape===s.id, op=s.op??1, sw=s.sw??(s.k==='arrow'?5:3), fo=s.fo??.5;
  const lay=labelLayout(s);
  const st={pane:'shapes',color:col,weight:sw,opacity:op,fillColor:col,fillOpacity:fo,bubblingMouseEvents:true,dashArray:sel&&s.k!=='arrow'?'10 6':null};
  const fillOnly=lay.segs? {stroke:false} : {};
  let main;
  if(s.k==='poly') main=L.polygon(s.pts,Object.assign({},st,fillOnly));
  else if(s.k==='rect') main=L.polygon(frameCorners(s),Object.assign({},st,fillOnly));
  else if(s.k==='circle') main=L.circle([s.lat,s.lng],Object.assign({radius:s.r},st,fillOnly));
  else{ const a=arrowGeom(s);
    L.polyline(a.line,Object.assign({},st,{fillOpacity:0})).addTo(g);
    main=L.polygon(a.head,Object.assign({},st,{weight:2,fillOpacity:op})); }
  main.addTo(g);
  if(lay.segs) lay.segs.forEach(seg=>L.polyline(seg,Object.assign({},st,{fill:false,lineCap:'butt',smoothFactor:0})).addTo(g));
  g.eachLayer(l=>l.on('click',e=>{ if(tool||isLocked()) return; e.originalEvent._gt=1; selectShape(s.id); }));
  const lt=isLight(col);
  lay.labels.forEach(lg=>L.marker(lg.ll,{pane:'shapes',interactive:false,keyboard:false,icon:L.divIcon({className:'slbl'+(lt?' lt':''),iconSize:[0,0],
      html:`<span style="color:${col};opacity:${Math.max(op,.6)};font-size:${lg.fs||lay.fs}px;transform:translate(-50%,-50%) translate(${lg.ox.toFixed(1)}px,${lg.oy.toFixed(1)}px) rotate(${lg.ang.toFixed(1)}deg)">${esc(s.label)}</span>`})}).addTo(g));
  g.addTo(shapeL); shapeLayers[s.id]=g;
}
function clearDraft(){ draft=[]; if(draftL) draftL.clearLayers(); }
function drawDraft(){
  draftL.clearLayers();
  const dot=ll=>L.circleMarker(ll,{pane:'handles',radius:7,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1,interactive:false}).addTo(draftL);
  if(draft.length>1) L.polyline(draft,{pane:'shapes',color:'#2563eb',weight:3,dashArray:'8 6',interactive:false}).addTo(draftL);
  if(tool==='circle'&&draft.length===1){} 
  draft.forEach(dot);
}
const STEP_TXT={
  frame:['Rahmen: 1. Ecke der weißen Seite (Zugang)','Rahmen: 2. Ecke der weißen Seite','Rahmen: Tiefe antippen'],
  rect:['Rechteck: 1. Ecke','Rechteck: 2. Ecke (gleiche Seite)','Rechteck: Breite antippen'],
  circle:['Kreis: Mittelpunkt antippen','Kreis: Punkt am Rand antippen (Radius)'],
  arrow:['Pfeil: Anfang antippen','Pfeil: Spitze antippen']
};
function shapeHint(){
  const n=draft.length, btns=[];
  if(n) btns.push({t:'↶',fn:()=>{ draft.pop(); drawDraft(); shapeHint(); }});
  if(tool==='poly'){
    if(n>=3) btns.push({t:'✓ Fläche',fn:finishPoly});
    btns.push({t:'Beenden',fn:()=>setTool(null)});
    setHint(n? `Fläche: ${n} Punkt${n>1?'e':''}${n>=3?' – ersten Punkt antippen oder ✓':''}` : 'Fläche: Eckpunkte nacheinander antippen',btns);
    return;
  }
  btns.push({t:'Beenden',fn:()=>setTool(null)});
  setHint(STEP_TXT[tool][n],btns);
}
function newShape(o){ const sh=Object.assign({id:uid(),color:DEF_COL,op:o.k==='arrow'?.5:1,fo:.5,sw:o.k==='arrow'?5:3,label:'',lpos:'edge'},o); P.shapes.push(sh); save(); drawShape(sh); }
function drawClick(ll){
  const p=[ll.lat,ll.lng];
  if(tool==='poly'){
    if(draft.length>=3){ const f=map.latLngToContainerPoint(draft[0]), q=map.latLngToContainerPoint(ll); if(f.distanceTo(q)<26){ finishPoly(); return; } }
    draft.push(p); drawDraft(); shapeHint(); return;
  }
  draft.push(p);
  const need=(tool==='frame'||tool==='rect')?3:2;
  if(draft.length<need){ drawDraft(); shapeHint(); return; }
  const [A,B,C]=draft;
  if(tool==='circle'){ const d=toM(A[0],A[1],B[0],B[1]); const r=Math.hypot(d.x,d.y); if(r<.5){ draft.pop(); toast('Randpunkt etwas weiter weg tippen'); return; } pushUndo(); newShape({k:'circle',lat:A[0],lng:A[1],r}); }
  else if(tool==='arrow'){ const d=toM(A[0],A[1],B[0],B[1]); if(Math.hypot(d.x,d.y)<1){ draft.pop(); toast('Spitze etwas weiter weg tippen'); return; } pushUndo(); newShape({k:'arrow',pts:[A,B]}); }
  else { const r=rect3(A,B,C); if(r.w<1||r.h<.5){ draft.pop(); toast('Punkt etwas weiter weg tippen'); return; }
    pushUndo();
    if(tool==='frame'){ const f=Object.assign({id:uid(),op:1},r); P.frames.push(f); save(); drawFrame(f); }
    else newShape(Object.assign({k:'rect'},r)); }
  clearDraft(); shapeHint();                          // Werkzeug bleibt aktiv, bis „Beenden“
  toast(SHAPE_N[tool]+' gesetzt');
}
function finishPoly(){ if(draft.length<3) return; pushUndo(); newShape({k:'poly',pts:draft.slice()}); clearDraft(); shapeHint(); toast('Fläche gesetzt'); }
function selectShape(id){
  setTool(null); stopGridMove(); closeSheets();

}
function drawShapeHandles(){
  hdlL.clearLayers(); hdls=[];
  const s=(P.shapes||[]).find(x=>x.id===selShape); if(!s){ selShape=null; return; }
  if(s.k==='rect'){ drawHandles(s,drawShape,showShapePanel); return; }
  const mk=(ll,cls,txt,size)=>L.marker(ll,{pane:'handles',draggable:true,keyboard:false,autoPan:false,
    icon:L.divIcon({className:'',html:`<div class="hdl ${cls}"><i>${txt||''}</i></div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]})}).addTo(hdlL);
  const end=()=>{ save(); drawShapeHandles(); showShapePanel(); };
  if(s.k==='circle'){
    const edge=()=>fromM(s.lat,s.lng,s.r,0);
    const mv=mk([s.lat,s.lng],'mv','✥',48), ed=mk(edge(),'cn','',44);
    mv.on('dragstart',pushUndo); mv.on('drag',()=>{ const p=mv.getLatLng(); s.lat=p.lat; s.lng=p.lng; drawShape(s); ed.setLatLng(edge()); }); mv.on('dragend',end);
    ed.on('dragstart',pushUndo); ed.on('drag',()=>{ const p=ed.getLatLng(); const d=toM(s.lat,s.lng,p.lat,p.lng); s.r=Math.max(.5,Math.hypot(d.x,d.y)); drawShape(s); }); ed.on('dragend',end);
    return;
  }
  s.pts.forEach((p,i)=>{ const m=mk(p,'cn','',44); m.on('dragstart',pushUndo); m.on('drag',()=>{ const q=m.getLatLng(); s.pts[i]=[q.lat,q.lng]; drawShape(s); }); m.on('dragend',end); });
  if(s.k==='poly'){
    s.pts.forEach((p,i)=>{ const q=s.pts[(i+1)%s.pts.length]; const mid=[(p[0]+q[0])/2,(p[1]+q[1])/2];
      const m=mk(mid,'add','+',34); let vi=-1;
      m.on('dragstart',()=>{ pushUndo(); vi=i+1; const g=m.getLatLng(); s.pts.splice(vi,0,[g.lat,g.lng]); });
      m.on('drag',()=>{ const g=m.getLatLng(); s.pts[vi]=[g.lat,g.lng]; drawShape(s); }); m.on('dragend',end); });

    mv.on('dragstart',()=>{ pushUndo(); st={c:mv.getLatLng(),pts:s.pts.map(p=>p.slice())}; });
    mv.on('drag',()=>{ const g=mv.getLatLng(); const dl=g.lat-st.c.lat, dn=g.lng-st.c.lng; s.pts=st.pts.map(p=>[p[0]+dl,p[1]+dn]); drawShape(s); });
    mv.on('dragend',end);
  }
}

/* ---------- Raster (immer Nord-Süd) ---------- */
function gridGeom(){
  const G=P.grid; const a=[G.lat,G.lng];
  const dLat=G.cell/MPD, dLng=G.cell/(MPD*Math.cos(a[0]*Math.PI/180));
  return {lat0:a[0]+G.rows/2*dLat, lng0:a[1]-G.cols/2*dLng, dLat, dLng};
}
function drawGrid(){
  gridL.clearLayers(); const G=P.grid; if(!G.on||G.lat==null) return;
  const g=gridGeom(), st={pane:'grid',color:G.color||'#111',weight:1.3,opacity:G.op??.75,interactive:false};
  const latB=g.lat0-G.rows*g.dLat, lngR=g.lng0+G.cols*g.dLng;
  for(let c=0;c<=G.cols;c++){ const x=g.lng0+c*g.dLng; L.polyline([[g.lat0,x],[latB,x]],st).addTo(gridL); }
  for(let r=0;r<=G.rows;r++){ const y=g.lat0-r*g.dLat; L.polyline([[y,g.lng0],[y,lngR]],st).addTo(gridL); }
  const cellPx=G.cell/mpp(G.lat); if(cellPx<13) return;
  const lbl=(lat,lng,t)=>L.marker([lat,lng],{pane:'grid',interactive:false,keyboard:false,icon:L.divIcon({className:'gridlbl'+(isLight(G.color)?' lt':''),iconSize:[26,16],iconAnchor:[13,8],html:`<span style="color:${G.color};opacity:${Math.max(.55,G.op??.75)}">${t}</span>`})}).addTo(gridL);
  for(let c=0;c<G.cols;c++){ const x=g.lng0+(c+.5)*g.dLng; lbl(g.lat0+g.dLat*.45,x,letters(c)); lbl(latB-g.dLat*.45,x,letters(c)); }
  for(let r=0;r<G.rows;r++){ const y=g.lat0-(r+.5)*g.dLat; lbl(y,g.lng0-g.dLng*.5,r+1); lbl(y,lngR+g.dLng*.5,r+1); }
}
function feldAt(lat,lng){ const G=P.grid; if(!G.on||G.lat==null) return ''; const g=gridGeom(); const c=Math.floor((lng-g.lng0)/g.dLng), r=Math.floor((g.lat0-lat)/g.dLat); return (c>=0&&r>=0&&c<G.cols&&r<G.rows)? letters(c)+(r+1):''; }
const GRID_COLORS=[['#111111','Schwarz'],['#ffffff','Weiß'],['#facc15','Gelb'],['#c81e1e','Rot'],['#1d4ed8','Blau']];
function isLight(c){ c=(c||'#111').replace('#',''); const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16); return (r*299+g*587+b*114)/1000>150; }

/* Raster-Fenster */

/* ---------- Adresssuche (OpenStreetMap / Nominatim) ---------- */
let searchPin=null, searchAbort=null;
function closeResults(){ $('res').style.display='none'; }
async function doSearch(){
  const q=$('q').value.trim(); const res=$('res');
  if(!q){ closeResults(); return; }
  $('q').blur();
  const co=q.match(/^\s*(-?\d{1,2}[.,]\d+)\s*[,; ]\s*(-?\d{1,3}[.,]\d+)\s*$/);
  if(co){ const lat=+co[1].replace(',','.'), lng=+co[2].replace(',','.'); closeResults(); closeSheets(); goTo(lat,lng,'Koordinate '+lat.toFixed(5)+', '+lng.toFixed(5)); return; }
  res.innerHTML=''; res.append(h('div',{class:'msg'},'Suche …')); res.style.display='block';
  if(searchAbort) searchAbort.abort(); searchAbort=('AbortController' in window)? new AbortController():null;
  try{
    const b=map.getBounds();
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&accept-language=de&countrycodes=at,de,ch,it,si,hu,sk,cz,li'
      +'&viewbox='+[b.getWest(),b.getNorth(),b.getEast(),b.getSouth()].map(v=>v.toFixed(4)).join(',')+'&q='+encodeURIComponent(q);
    const r=await fetch(url,{headers:{'Accept':'application/json'},signal:searchAbort&&searchAbort.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const js=await r.json(); res.innerHTML='';
    if(!js.length){ res.append(h('div',{class:'msg'},'Nichts gefunden. Tipp: Straße Hausnummer, Ort')); return; }
    js.forEach(x=>{
      const a=x.address||{};
      const line1=[a.road||a.pedestrian||a.footway||a.square||x.name||'', a.house_number||''].join(' ').trim() || (x.display_name||'').split(',')[0];
      const line2=[a.postcode||'', a.city||a.town||a.village||a.municipality||''].join(' ').trim();
      const extra=x.name&&x.name!==line1? x.name : '';
      res.append(h('button',{onclick:()=>{ closeResults(); closeSheets(); const label=[extra,line1,line2].filter(Boolean).join(', '); goTo(+x.lat,+x.lon,label); if(!P.addr){ P.addr=[line1,line2].filter(Boolean).join(', '); save(); } }},
        h('b',null,extra||line1||x.display_name), h('span',null,extra?[line1,line2].filter(Boolean).join(', '):(line2||x.display_name))));
    });
  }catch(e){
    if(e.name==='AbortError') return;
    res.innerHTML=''; res.append(h('div',{class:'msg'},navigator.onLine===false?'Keine Internetverbindung: Die Adresssuche braucht Netz.':'Suche fehlgeschlagen ('+e.message+').'));
  }
}
function goTo(lat,lng,label){
  map.setView([lat,lng],18);
  if(searchPin) map.removeLayer(searchPin);
  searchPin=L.marker([lat,lng],{interactive:false,keyboard:false,zIndexOffset:-1000,icon:L.divIcon({className:'',html:'<div class="searchpin"></div>',iconSize:[22,22],iconAnchor:[11,24]})}).addTo(posL);
  setTimeout(()=>{ if(searchPin){ posL.removeLayer(searchPin); searchPin=null; } },20000);
  toast(label);
}

/* ---------- Standort ---------- */
let posDot=null, posAcc=null;
let posWatch=null, lastPos=null, jumpNext=false;
function showPos(p){
  const ll=[p.coords.latitude,p.coords.longitude]; lastPos={ll,acc:p.coords.accuracy};
  if(!posAcc){ posAcc=L.circle(ll,{radius:p.coords.accuracy,color:'#2563eb',weight:1,fillOpacity:.12,interactive:false}).addTo(posL);
    posDot=L.marker(ll,{interactive:false,keyboard:false,zIndexOffset:-500,icon:L.divIcon({className:'',html:'<div class="posdot"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(posL); }
  else { posAcc.setLatLng(ll).setRadius(p.coords.accuracy); posDot.setLatLng(ll); }
  $('bLoc').classList.add('active');
  if(jumpNext){ jumpNext=false; map.setView(ll,Math.max(map.getZoom(),18)); toast('Eigener Standort (± '+Math.round(p.coords.accuracy)+' m)'); }
}
function posError(err){
  if(err&&err.code===3&&lastPos) return;          // Zeitüberschreitung bei laufender Ortung ignorieren
  stopWatch();
  if(err&&err.code===1) locHelp('denied'); else if(jumpNext){ jumpNext=false; toast('Standort derzeit nicht verfügbar (kein GPS-Empfang?). Bitte nochmals versuchen.'); }
}
function stopWatch(){ if(posWatch!=null){ try{ navigator.geolocation.clearWatch(posWatch); }catch(e){} posWatch=null; } $('bLoc').classList.remove('active'); }
function locate(){
  if(!window.isSecureContext&&location.protocol!=='file:'){ locHelp('insecure'); return; }
  if(!navigator.geolocation){ toast('Standort wird von diesem Gerät nicht unterstützt.'); return; }
  jumpNext=true;
  if(lastPos&&posWatch!=null){ jumpNext=false; map.setView(lastPos.ll,Math.max(map.getZoom(),18)); toast('Eigener Standort (± '+Math.round(lastPos.acc)+' m)'); return; }
  toast('Standort wird ermittelt …');
  /* zuerst schnelle Position, dann laufend genauer */
  navigator.geolocation.getCurrentPosition(showPos,e=>{ if(e.code===1) posError(e); },{enableHighAccuracy:false,timeout:8000,maximumAge:60000});
  if(posWatch==null) posWatch=navigator.geolocation.watchPosition(showPos,posError,{enableHighAccuracy:true,timeout:20000,maximumAge:5000});
}

/* ---------- Bild erzeugen und teilen (Signal, WhatsApp …) ---------- */
function haloText(ctx,t,x,y,color,font,align,base){
  ctx.font=font||'bold 12px Arial'; ctx.textAlign=align||'center'; ctx.textBaseline=base||'middle';
  ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineJoin='round'; ctx.strokeText(t,x,y);
  ctx.fillStyle=color||'#111'; ctx.fillText(t,x,y);
}
function rr(ctx,x,y,w,hh,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+hh,r); ctx.arcTo(x+w,y+hh,x,y+hh,r); ctx.arcTo(x,y+hh,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawMarkCanvas(ctx,t,v,x,y){
  if(t==='S'){ const im=symImg(v); ctx.save(); ctx.shadowColor='rgba(255,255,255,.95)'; ctx.shadowBlur=3; try{ if(im.complete&&im.naturalWidth) ctx.drawImage(im,x-17,y-17,34,34); }catch(e){} ctx.restore(); return; }

let shareFile=null, shareURL=null;
async function exportImage(){
  setTool(null); if(selFrame||selShape) deselectFrame(); closeResults();
  toast('Bild wird erstellt …');
  await new Promise(r=>setTimeout(r,60));
  let res; try{ res=await renderImage(); }catch(e){ console.error(e); toast('Bild konnte nicht erstellt werden: '+e.message); return; }
  const blob=await new Promise(r=>{ try{ res.cv.toBlob(r,'image/png'); }catch(e){ r(null); } });
  if(!blob){ toast('Bild konnte nicht erstellt werden.'); return; }
  const d=new Date(); const name=('Gelaendetaufe_'+(P.name||'')+'_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())).replace(/[^\wäöüÄÖÜß-]+/g,'_').replace(/_+/g,'_')+'.png';
  shareFile=new File([blob],name,{type:'image/png'});
  if(shareURL) URL.revokeObjectURL(shareURL); shareURL=URL.createObjectURL(blob);
  $('prevImg').src=shareURL;
  const can=!!(navigator.canShare&&navigator.canShare({files:[shareFile]}));
  $('bSend').style.display=can?'':'none';
  $('prevNote').textContent=(can?'„Senden“ öffnet das Teilen-Menü: dort Signal oder WhatsApp wählen und die Gruppe antippen.':'Teilen wird von diesem Browser nicht unterstützt: Bild speichern und in Signal oder WhatsApp als Foto anhängen.')
    +(res.nT?'':' Hinweis: Das Kartenbild fehlt (offline oder noch nicht geladen).');
  openSheet('shShare');
}
async function sendImage(){
  if(!shareFile) return;
  try{ await navigator.share({files:[shareFile],title:shareFile.name}); }
  catch(e){ if(e.name!=='AbortError'){ toast('Teilen nicht möglich – Bild wird gespeichert.'); downloadImage(); } }
}
function downloadImage(){
  if(!shareFile) return;
  const a=h('a',{href:shareURL,download:shareFile.name}); document.body.append(a); a.click(); setTimeout(()=>a.remove(),1500);
  toast('Bild gespeichert (Downloads / Dateien).');
}

function init(){

  $('q').addEventListener('input',()=>{ $('qx').style.display=$('q').value?'block':'none'; });
  $('qx').onclick=()=>{ $('q').value=''; $('qx').style.display='none'; closeResults(); };
  $('bSearch').onclick=doSearch;
  $('bLoc').onclick=locate;
  $('bLock').onclick=toggleLock;
  $('bLayer').onclick=()=>{ const i=LAYER_ORDER.indexOf(P.layer); P.layer=LAYER_ORDER[(i+1)%LAYER_ORDER.length]; save(); setBase(); toast('Karte: '+LAYERS[P.layer].n); };
  $('bMarker').onclick=openMarkerPicker;
  $('bDraw').onclick=openDrawPicker;
  $('bList').onclick=()=>{ closeResults(); openList(); };
  $('bUndo').onclick=undo;
  $('bShare').onclick=()=>{ if(tool) setTool(null); if(selFrame||selShape) deselectFrame(); exportImage(); };
  $('bSend').onclick=sendImage; $('bSave').onclick=downloadImage;
  $('backdrop').onclick=()=>closeSheets();
  document.querySelectorAll('.sheet .x').forEach(b=>b.onclick=()=>closeSheets());
  /* Seite selbst darf weder scrollen noch zoomen – nur die Karte und geöffnete Listen */
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('dblclick',e=>{ if(!e.target.closest('#map')) e.preventDefault(); },{passive:false});
  document.addEventListener('touchmove',e=>{ if(e.target.closest('#map')||e.target.closest('.sh-body')||e.target.closest('#res')||e.target.closest('.pscroll')||e.target.closest('input[type=range]')) return; e.preventDefault(); },{passive:false});
  /* Seite darf nie verrutschen (z. B. wenn die Tastatur aufgeht) */
  const unscroll=()=>{ if(window.scrollY||window.scrollX) window.scrollTo(0,0); const d=document.documentElement, b=document.body; if(d.scrollTop) d.scrollTop=0; if(b.scrollTop) b.scrollTop=0; if(b.scrollLeft) b.scrollLeft=0; };
  window.addEventListener('scroll',unscroll); document.addEventListener('scroll',unscroll,true);
  document.addEventListener('focusout',()=>setTimeout(unscroll,50)); document.addEventListener('focusin',()=>setTimeout(unscroll,350));
  if(window.visualViewport) visualViewport.addEventListener('resize',()=>setTimeout(unscroll,100));

  window.addEventListener('pagehide',saveNow);
  document.addEventListener('pointerdown',keepAwake,{once:true});

  /* Als Web-App (GitHub Pages, https): App selbst offline verfügbar machen */
  if(location.protocol==='https:'&&'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

}
